name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repository hygiene
        run: python3 scripts/check_repo.py
      - name: Script CLIs parse arguments
        run: |
          python3 scripts/snap_board.py --help >/dev/null
          python3 scripts/write_board.py --help >/dev/null
          # Invalid URLs must be rejected with exit code 2 before any browser launch
          set +e
          python3 scripts/snap_board.py "https://example.com" out.png; test $? -eq 2
          python3 scripts/write_board.py "https://example.com" "x"; test $? -eq 2
